[package]
name = "mdedit"
version = "0.20.0"
description = "MdEdit - Markdown Desktop Editor"
authors = []
license = ""
repository = ""
default-run = "mdedit"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mdedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mdedit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
base64 = "0.22"

# SPEC-PREVIEW-022: asset 응답 HTML에 charset을 붙이기 위해 tauri 2.10.3을 vendor 사본으로 대체한다.
# tauri를 올릴 때의 재적용 절차: .moai/specs/SPEC-PREVIEW-022-html-original-charset/research.md §6
[patch.crates-io]
tauri = { path = "vendor/tauri" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
