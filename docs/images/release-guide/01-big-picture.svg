<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-labelledby="t01 d01" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', 'Apple SD Gothic Neo', 'Hiragino Sans', 'Microsoft YaHei', system-ui, sans-serif">
  <title id="t01">태그 하나에서 설치 파일까지 — 전체 그림</title>
  <desc id="d01">저장소 주인이 태그를 푸시하면 GitHub 서버가 버전 검사, 초안 릴리스 생성, macOS·Windows 빌드와 업로드를 차례로 실행하고, 마지막 게시는 주인이 직접 합니다. 아래쪽은 GitHub이 빌려주는 것과 저장소에 직접 만든 것을 나눠 보여 줍니다.</desc>
  <defs>
    <marker id="a01" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#3A5673"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="600" fill="#FAF9F6"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#1F2A37">태그 하나에서 설치 파일까지</text>
  <text x="40" y="84" font-size="15" fill="#3A5673">GitHub은 무대를 빌려주고, 대본과 안전장치는 저장소에 직접 적었습니다</text>

  <!-- step cards: x = 40 + i*240, w = 200, y = 110, h = 150 -->
  <rect x="40" y="110" width="200" height="150" rx="10" fill="#F7F2E7" stroke="#8A6410" stroke-width="1.6"/>
  <text x="56" y="140" font-size="14" fill="#8A6410">1 · 저장소 주인</text>
  <text x="56" y="168" font-size="17" font-weight="700" fill="#1F2A37">태그 푸시</text>
  <text x="56" y="194" font-size="14" fill="#1F2A37" font-family="'JetBrains Mono', ui-monospace, monospace">git push origin</text>
  <text x="56" y="216" font-size="14" fill="#1F2A37" font-family="'JetBrains Mono', ui-monospace, monospace">v0.19.0</text>

  <rect x="280" y="110" width="200" height="150" rx="10" fill="#EEF3F7" stroke="#3A5673" stroke-width="1.2"/>
  <text x="296" y="140" font-size="14" fill="#3A5673" font-family="'JetBrains Mono', ui-monospace, monospace">2 · version-check</text>
  <text x="296" y="168" font-size="17" font-weight="700" fill="#1F2A37">버전 검사</text>
  <text x="296" y="194" font-size="14" fill="#1F2A37">태그 = 세 파일 버전</text>
  <text x="296" y="216" font-size="14" fill="#1F2A37">다르면 여기서 멈춤</text>

  <rect x="520" y="110" width="200" height="150" rx="10" fill="#EEF3F7" stroke="#3A5673" stroke-width="1.2"/>
  <text x="536" y="140" font-size="14" fill="#3A5673" font-family="'JetBrains Mono', ui-monospace, monospace">3 · create-release</text>
  <text x="536" y="168" font-size="17" font-weight="700" fill="#1F2A37">초안 만들기</text>
  <text x="536" y="194" font-size="14" fill="#1F2A37">초안 릴리스 1개 생성</text>
  <text x="536" y="216" font-size="14" fill="#1F2A37">본문 = 안내 + 노트</text>

  <rect x="760" y="110" width="200" height="150" rx="10" fill="#EEF3F7" stroke="#3A5673" stroke-width="1.2"/>
  <text x="776" y="140" font-size="14" fill="#3A5673" font-family="'JetBrains Mono', ui-monospace, monospace">4 · build</text>
  <text x="776" y="168" font-size="17" font-weight="700" fill="#1F2A37">빌드·업로드</text>
  <text x="776" y="194" font-size="14" fill="#1F2A37">맥: _aarch64.dmg</text>
  <text x="776" y="216" font-size="14" fill="#1F2A37">윈도: .exe와 .msi</text>

  <rect x="1000" y="110" width="200" height="150" rx="10" fill="#F7F2E7" stroke="#8A6410" stroke-width="1.6"/>
  <text x="1016" y="140" font-size="14" fill="#8A6410">5 · 저장소 주인</text>
  <text x="1016" y="168" font-size="17" font-weight="700" fill="#1F2A37">확인 후 게시</text>
  <text x="1016" y="194" font-size="14" fill="#1F2A37">초안을 확인하고</text>
  <text x="1016" y="216" font-size="14" fill="#1F2A37">Publish를 직접 누름</text>

  <!-- arrows: (A.x + 200, 185) -> (B.x - 10, 185) -->
  <path d="M 240 185 H 270" stroke="#3A5673" stroke-width="2" fill="none" marker-end="url(#a01)"/>
  <path d="M 480 185 H 510" stroke="#3A5673" stroke-width="2" fill="none" marker-end="url(#a01)"/>
  <path d="M 720 185 H 750" stroke="#3A5673" stroke-width="2" fill="none" marker-end="url(#a01)"/>
  <path d="M 960 185 H 990" stroke="#3A5673" stroke-width="2" fill="none" marker-end="url(#a01)"/>

  <!-- legend -->
  <rect x="40" y="286" width="18" height="18" rx="3" fill="#F7F2E7" stroke="#8A6410" stroke-width="1.6"/>
  <text x="66" y="300" font-size="14" fill="#1F2A37">저장소 주인이 직접 하는 일</text>
  <rect x="300" y="286" width="18" height="18" rx="3" fill="#EEF3F7" stroke="#3A5673" stroke-width="1.2"/>
  <text x="326" y="300" font-size="14" fill="#1F2A37">GitHub 서버가 자동으로 하는 일 (중간에 실패하면 다음 단계는 실행되지 않음)</text>

  <!-- bottom: two role boxes -->
  <rect x="40" y="330" width="560" height="230" rx="12" fill="#EEF3F7" stroke="#3A5673" stroke-width="1"/>
  <text x="64" y="372" font-size="18" font-weight="700" fill="#1F2A37">GitHub이 빌려주는 것 (무대)</text>
  <circle cx="68" cy="403" r="3" fill="#3A5673"/>
  <text x="80" y="408" font-size="15" fill="#1F2A37">Actions: 맥·윈도 서버를 실행 때마다 빌려줌</text>
  <circle cx="68" cy="433" r="3" fill="#3A5673"/>
  <text x="80" y="438" font-size="15" fill="#1F2A37">Releases: 설치 파일을 올려 두는 게시판</text>
  <circle cx="68" cy="463" r="3" fill="#3A5673"/>
  <text x="80" y="468" font-size="15" fill="#1F2A37">GITHUB_TOKEN: 실행마다 새로 나오는 출입증</text>
  <circle cx="68" cy="493" r="3" fill="#3A5673"/>
  <text x="80" y="498" font-size="15" fill="#1F2A37">태그 이벤트: 태그가 올라오면 실행을 시작</text>

  <rect x="640" y="330" width="560" height="230" rx="12" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.6"/>
  <text x="664" y="372" font-size="18" font-weight="700" fill="#1F2A37">우리가 만든 것 (대본과 안전장치)</text>
  <circle cx="668" cy="403" r="3" fill="#8A6410"/>
  <text x="680" y="408" font-size="15" fill="#1F2A37">release.yml: 무엇을 어떤 순서로 할지 적은 대본</text>
  <circle cx="668" cy="433" r="3" fill="#8A6410"/>
  <text x="680" y="438" font-size="15" fill="#1F2A37">check-release-version.mjs: 태그·버전 검사기</text>
  <circle cx="668" cy="463" r="3" fill="#8A6410"/>
  <text x="680" y="468" font-size="15" fill="#1F2A37">release-notes-header.md: 설치 안내 머리말</text>
  <circle cx="668" cy="493" r="3" fill="#8A6410"/>
  <text x="680" y="498" font-size="15" fill="#1F2A37">tauri.conf.json: 맥 ad-hoc 서명 설정 한 줄</text>
  <circle cx="668" cy="523" r="3" fill="#8A6410"/>
  <text x="680" y="528" font-size="15" fill="#1F2A37">README · BUILD.md · CHANGELOG: 사람용 안내</text>
</svg>
