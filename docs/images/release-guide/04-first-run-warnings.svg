<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-labelledby="t04 d04" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', 'Apple SD Gothic Neo', 'Hiragino Sans', 'Microsoft YaHei', system-ui, sans-serif">
  <title id="t04">처음 실행할 때 사용자가 겪는 순서 — macOS와 Windows</title>
  <desc id="d04">서명·공증을 받지 않은 앱이라 처음 실행할 때 경고가 나옵니다. macOS는 앱을 한 번 열어 본 뒤 시스템 설정의 개인정보 보호 및 보안에서 그래도 열기와 열기를 누르고, Windows는 SmartScreen 경고에서 추가 정보와 실행을 누릅니다. 실제 화면 문구와 버튼 이름은 실기기에서 아직 확인하지 않았습니다. 화면 캡처가 아니라 순서를 그린 도식입니다.</desc>
  <defs>
    <marker id="a04" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#3A5673"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="720" fill="#FAF9F6"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#1F2A37">처음 실행할 때 사용자가 겪는 순서</text>
  <text x="40" y="84" font-size="15" fill="#3A5673">서명·공증이 없는 앱이라 첫 실행에서 한 번 경고가 나옵니다 (화면 캡처가 아닌 순서도)</text>

  <!-- lanes: x = 40 / 640, w = 560, y = 110..690 -->
  <rect x="40" y="110" width="560" height="580" rx="14" fill="#EEF3F7" stroke="#3A5673" stroke-width="1"/>
  <text x="60" y="140" font-size="18" font-weight="700" fill="#1F2A37">macOS (Apple Silicon)</text>
  <rect x="640" y="110" width="560" height="580" rx="14" fill="#EEF3F7" stroke="#3A5673" stroke-width="1"/>
  <text x="660" y="140" font-size="18" font-weight="700" fill="#1F2A37">Windows (64비트)</text>

  <!-- step cards: x = lane.x + 20, w = 520, y = 156 + i*86, h = 60 -->
  <g font-size="15" fill="#1F2A37">
    <rect x="60" y="156" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="78" y="191">1 · _aarch64.dmg를 내려받아 설치</text>
    <rect x="60" y="242" width="520" height="60" rx="8" fill="#F7F2E7" stroke="#8A6410" stroke-width="1.6"/>
    <text x="78" y="277">2 · 앱을 한 번 열어 봄 → 차단 안내가 뜸</text>
    <rect x="60" y="328" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="78" y="363">3 · 시스템 설정 → 개인정보 보호 및 보안</text>
    <rect x="60" y="414" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="78" y="449">4 · 아래쪽 '그래도 열기' → 다시 뜬 안내에서 '열기'</text>
    <rect x="60" y="500" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="78" y="535">5 · mdedit 실행, 다음부터는 바로 열림</text>

    <rect x="660" y="156" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="678" y="191">1 · -setup.exe를 내려받아 실행</text>
    <rect x="660" y="242" width="520" height="60" rx="8" fill="#F7F2E7" stroke="#8A6410" stroke-width="1.6"/>
    <text x="678" y="277">2 · SmartScreen 경고가 뜰 수 있음</text>
    <rect x="660" y="328" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="678" y="363">3 · 경고 창에서 '추가 정보'를 누름</text>
    <rect x="660" y="414" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="678" y="449">4 · '실행'을 눌러 설치를 이어 감</text>
    <rect x="660" y="500" width="520" height="60" rx="8" fill="#FAF9F6" stroke="#3A5673" stroke-width="1.2"/>
    <text x="678" y="535">5 · mdedit 실행</text>
  </g>

  <!-- arrows: (cx, y + 60) -> (cx, next.y - 10) -->
  <g stroke="#3A5673" stroke-width="2" fill="none">
    <path d="M 320 216 V 232" marker-end="url(#a04)"/>
    <path d="M 320 302 V 318" marker-end="url(#a04)"/>
    <path d="M 320 388 V 404" marker-end="url(#a04)"/>
    <path d="M 320 474 V 490" marker-end="url(#a04)"/>
    <path d="M 920 216 V 232" marker-end="url(#a04)"/>
    <path d="M 920 302 V 318" marker-end="url(#a04)"/>
    <path d="M 920 388 V 404" marker-end="url(#a04)"/>
    <path d="M 920 474 V 490" marker-end="url(#a04)"/>
  </g>

  <!-- unverified notes -->
  <rect x="60" y="590" width="520" height="80" rx="8" fill="#F7F2E7" stroke="#8A6410" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="78" y="620" font-size="15" font-weight="700" fill="#8A6410">아직 확인 전</text>
  <text x="78" y="646" font-size="14" fill="#1F2A37">실제 문구·버튼 이름, 암호를 묻는지 여부는 실기기 확인 필요</text>
  <rect x="660" y="590" width="520" height="80" rx="8" fill="#F7F2E7" stroke="#8A6410" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="678" y="620" font-size="15" font-weight="700" fill="#8A6410">아직 확인 전</text>
  <text x="678" y="646" font-size="14" fill="#1F2A37">경고가 실제로 뜨는지와 버튼 이름은 실기기 확인 필요</text>
</svg>
