<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="mdedit SVG 샘플">
  <!-- 그래디언트: url(#...) fragment 참조가 sanitize 후에도 보존되는지 확인 -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 라운드 사각형 (fragment gradient 참조) -->
  <rect x="8" y="8" width="304" height="184" rx="18" fill="url(#grad)"/>
  <ellipse cx="160" cy="70" rx="150" ry="80" fill="url(#glow)"/>

  <!-- 도형들 -->
  <circle cx="80" cy="110" r="34" fill="#ffffff" fill-opacity="0.85"/>
  <polygon points="200,80 240,150 160,150" fill="#fbbf24"/>
  <path d="M250 60 q30 20 0 60 q-30 -20 0 -60 Z" fill="#f472b6"/>

  <!-- 텍스트 -->
  <text x="160" y="180" font-family="sans-serif" font-size="18" font-weight="700"
        text-anchor="middle" fill="#ffffff">mdedit · SVG viewer</text>
</svg>
